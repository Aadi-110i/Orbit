name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The registry occasionally drops a connection mid-install, so the install
      # is retried once before the job is allowed to fail.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefer-offline || \
          npm ci --no-audit --no-fund --prefer-offline

      - name: Build (includes a full TypeScript check)
        run: npm run build
